name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: job-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pyinstaller
      - name: Build portable application
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir
          --name AIJobAssistant
          --collect-all streamlit
          --collect-submodules app
          --add-data "app;app"
          --add-data "data/samples;data/samples"
          desktop_launcher.py
      - name: Create portable archive
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist\AIJobAssistant\* -DestinationPath release\AI-Job-Assistant-Portable.zip -Force
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: ai-job-assistant-windows
          path: job-agent/release/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: job-agent/release/*
          generate_release_notes: true

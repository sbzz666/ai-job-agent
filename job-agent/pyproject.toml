[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-agent"
version = "0.1.0"
description = "A testable AI job application assistant"
requires-python = ">=3.11"
dependencies = [
  "Authlib>=1.3.2,<2",
  "fastapi>=0.115,<1",
  "openai>=2.0,<3",
  "pydantic>=2.7,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "PyMuPDF>=1.24,<2",
  "streamlit>=1.40,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
